upstream webapp {
    server prototipo:5005;
}

server {
    listen 5085;
    server_name localhost;
    client_max_body_size 60M;

    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self'  'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none';" always;

    location /static/ {
        alias /staticfiles/;
    }

    location / {
        proxy_pass http://webapp;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(env|ini|log|bak|sql|swp|dist|json|yaml|yml)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

}
